body:
  text: 卷二大暑賦其為暑也羲和總駕發扶木太陽為輿達炎燭靈威參垂步朱轂赫赫炎炎烈烈暉暉若熾燎之附體又溫泉而沈肌獸喘氣于玄景鳥戢翼于高危農畯捉鐏而去疇織女釋杼而下機溫風至而增熱歊悒懾而無依披襟領而長嘯冀微風之來思藝文類聚五實冰漿於玉盞玉燭寶典六黎陽山賦自魏都而南邁迄洪川以朅休想王旅之旌旄望南路之遐修御輕駕而西徂過舊塢之高區爾乃踰峻嶺超連岡一登九息遂臻其陽南蔭黃河左覆金城青壇承祀高碑頌靈珍木駢羅奮華揚榮雲興風起蕭瑟清泠延首南望顧瞻舊鄉桑梓增敬慘切懷傷河源汨其東遊陽烏飄而南翔睹衆物之集華退欣欣而樂康藝文類聚七良遊未厭白日潛輝文選謝叔源游西池詩注魯都賦昔大庭氏肇建厥居少昊受命亦都茲焉藝文類聚六十一巨海分焉傾瀉百川初學記六山則連岡屬嶺曀魅峽北紫金揚暉于鴻岸水精潛光乎雲穴岱宗邈其層秀干氣霧以高越其木則赤桋青松文莖蕙棠洪幹百圍高徑穹皇竹則填彼山陔根濔阪域夏簜攢包徑條竝殖蒙雪含霜不渝其色翠實離離鳳凰攸食藝文類聚六十一北堂書鈔一百五十八初學記二十八芳果萬名攢羅廣庭霜滋靈潤時至則零御覽九百六十四黍稷油油粳族垂芒殘穗滿握一穎千箱初學記二十七祿鷁葱鶖御覽九百二十五水産衆夥各有彝倫頒首莘尾豐顱重齗戴兵挾刃盤甲曲鱗藝文類聚六十一其鹽則高盆連冉波酌海臻素鹺凝結皓若雪氛書鈔一百四十六又有鹽池漭沆煎炙暘春焦暴濆沫疏鹽自殷挹之不損取之不動書鈔一百四十六其女工則絳綺縠御覽八百十六纖纖絲履燦爛鮮新靈草尋夢華榮奏表以文組綴以珠蠙步蹈安審接跡承身書鈔一百三十六初學記二十六御覽六百九十七且觀其時謝節移和族綏宗招歡合好肅戒友朋龍燭九枝逸稻壽陽賦湛露以留客召麗妙之新倡衆媛侍側鱗附盈房蛾眉清眸顏若雪霜玄髮曜粉芳澤不含丹吮素巧笑妍詳袿裾紛裶振珮鳴璜插曜日之珍笄珥明月之珠璫舞人就列整飾容華妖服初工刻畫綺紗和顏揚眸眄風長歌飄乎猋發身如轉波尋虛騁迹顧與節和縱修袖以終曲若奔星之赴河及其素秋二七天漢指隅民胥祓禊國子水嬉工祝掩渚揚茢陳詞緹帷彌津丹帳覆洲日暮宴罷車騎就衢蓋如飛鶴馬如游魚伊歲之冬雲氣清晞水沍露凝冰雪皚皚藝文類聚六十一書鈔一百三十五初學記三又四又十五御覽三百八十一七百二七百十八金陛玉砌玄枑雲柯文選王融曲水詩序注應門巖巖朱扉含光路殿巋其隆崇文陛巘其高驤聽迅雷于長除若有聞而復亡其園囿苑沼駢田接連淥池分浪以帶石垠文隅瓊岸華玉依津邦乃大狩振揚炎威教民即戎講習興師落幕包括連結營圍長罼掩壑大羅被睪毛群隕殪羽族殲剝填崎塞畎不可勝録藝文類聚六十一御覽八百三十二戢武器于有炎之庫放戎馬于巨野之坰水經泗水注彼齊魯諸儒皆繪辨端衣散佩垂紳金聲玉色溫故知新訪魯都之區域弔先王之遺真御覽一百五十六旁厲四邑延於休溷冠蓋交錯隱隱轔轔韻補一溷字注湯鹽池東西長七十里南北七里鹽生海內暮取朝復生北堂書鈔一四六陽窗含輝陰牖納光編珠二蘋藻漂於陽侯芙蕖出乎渚際奮紅葩之熩熩逸景燭於崖水韻補四水字注龜螭潛滑於黃泥文魚游踊於清瀨浚迅波以遠騰正泌瀄乎湄㵝韻補四瀨字注建燕尾之飛旌編珠二巖險回隔峻巘隱曲猛獸深潛介禽竄匿韻補五曲字注猰窳猛容舉父猴玃戰鬭陵岡瞋怒奮赫韻補五玃字注晝藏宵行俯仰哮咆禽獸怖竄失偶喪儔韻補二咆字注若乃考王道之去就覽萬代之興衰發龍圖於金縢啓洛典乎石扉崇七經之旨義刪百氏之乖違北堂書鈔一零一九六覃思圖籍闡迪德謨蘊包古今撰集丘素韻補四謨字注舉成均之舊志建學校乎泗濱表泮宮之憲肆有唐虞之三墳韻補一墳字注採逸禮於殘竹聽遺詩乎達路覽國俗之盛衰求群士之德素北堂書鈔一零一至于日昃體勞怠倦一張一弛文武之訓韻補四倦字注曳髮編芒蔚若霧烟九采灼鑠青藻紛繽韻補一烟字注奉彝執羃納觶授觴引滿輒酹滴瀝受觥韻補二觴字注貴交尚信輕命重氣義激毫毛怨成梗概韻補四概字注遂志賦幸遇明后因志東傾披此豐草乃命小生生之小矣何茲云當牧馬于路役車低昂愴恨惻切我獨西行去峻溪之鴻洞觀日日于朝陽釋叢棘之餘刺踐檟林之柔芳皎玉粲以曜目榮日華以舒光信此山之多靈何神分之煌煌聊且遊觀周歷高岑仰攀高枝側身遺陰磷磷𥗺𥗺以廣其心伊天皇之樹葉必結根于仁方梢吳夷于東隅掣叛臣乎南荊戢干戈于內庫我馬縶而不行揚洪恩于無涯聽頌聲之洋洋四寓奠以無為玄道穆以普將翼俊乂于上列退仄陋于下場襲初服之蕪薉託蓬廬以遊翔豈放言而云爾乃旦夕之可忘藝文類聚二十六清慮賦結東阿之扶桑接西雷乎燭龍入鐐碧之閒出水精之都上青臒之山蹈琳珉之塗玉樹翠葉上棲金烏初學記二十七文選雪賦注御覽八百八錯華玉以茨屋駢雄黃以為墀紛以瑤蕊糅以玉夷初學記二十七御覽一百八十五後布玳瑁之席前設蟕蠵之床憑文瑤之几對精金之盤書鈔一百三十三引兩條御覽七百六又七百九又八百七又八百九虞氏之爨加火珠之甑炊嘉禾之米和蓂莢之飯北堂書鈔一百四十四仰稱木韭俯拔廉薑太平御覽九百七十四𤅢鳳卵玉燭寶典二乃生氣電之班輿北堂書鈔一四一瓜賦楨在曹植坐廚人進瓜植命為賦促立成其辭曰含金精之流芳冠種瓜以作珍三星在隅溫風節暮枕翹于藤流美遠布黃華炳曄潛實獨著豐細異形圓方殊務揚暉發藻九采雜揉厥初作苦終然允甘應時湫熟含蘭吐芳藍皮蜜理素肌丹瓤乃命圃師貢其最良投諸清流一浮一藏更布象牙之席薰玳瑁之筵憑彤玉之几酌縹碧之樽析以金刀四剖三離承之以雕盤羃之以纖絺甘逾蜜房冷亞冰圭藝文類聚八十七文選顏延年皇太子釋奠會詩注初學記十又二十七引四條御覽二百四十六八百十九九百七十八與曹植書明使君始垂哀憐意眷日崇譬之疾病乃使炎農分藥歧伯下針疾雖未除就沒無恨何者以其天醫至神而榮魄自盡也御覽七百三十九肅以素秋則落文選潘正叔贈陸機詩注又劉琨重贈盧諶詩注又三五張協七命注諫曹植書諫曹植書家丞邢顒北土之彥少秉高節玄靜淡泊言少理多真雅士也楨誠不足同貫斯人並列左右而楨禮遇殊特顒反疏簡私懼觀者將謂君侯習近不肖禮賢不足採庶子之春華忘家丞之秋實為上招謗其罪不小以此反側魏志邢顒傳答魏太子丕借廓落帶書答魏太子丕借廓落帶書楨聞荊山之璞曜元后之寶隨侯之珠燭衆士之好南垠之金登窈窕之首貂貚之尾綴侍臣之幘此四寶者伏朽石之下潛汙泥之中而揚光千載之上發彩疇昔之外亦皆未能初自接于至尊也夫尊者所服卑者所修也貴者所御賤者所先也故夏屋初成而大匠先立其下嘉禾始熟而農夫先嘗其粒恨楨所帶無他妙飾若實殊異尚可納也魏志王粲傳注引典略又略見御覽六百八十七六百八十八處士國文甫碑先生執乾靈之貞潔稟神祇之正性咳笑則孝悌之端著匍匐則清節之兆見齠齔以及成人體無懈容口無愆辭兢兢業業小心畏忌勤讓同儔敬事長老雖周之樂正子春漢之江都董相其飭躬力行無以尚之是以長安師其仁朋友欽其義閨門稱其慈宗屬懷其惠既乃潛身窮巖遊心載籍薄世名也初海內之亂不視膳羞十有餘年憂心泣血不勝其哀形銷氣竭以建安十七年四月卒于時龍德逸民黃髮實叟綴文通儒有方彥士莫不拊心長號如喪同生咸以為誄所以昭行也銘所以旌德也古之君子既沒而令問不忘者由斯一者也銘曰懿矣先生天授德度外清內白如玉之素逍遙九皋方回是慕不計治萃名與殊路知我者希韞櫝未酤喪過乎哀遘疾不悟早世永頽違此榮祚咨爾末徒聿修歡故藝文類聚三十七
