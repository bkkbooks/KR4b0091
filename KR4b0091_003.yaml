body:
  text: 附録又贈徐幹又贈徐幹猥蒙惠咳唾貺以雅頌聲高義厲青雲灼灼有表經書鈔一百失題詩失題詩翩翩野青雀棲竄茨棘蕃朝拾平田粒夕飲曲池泉猥出蓬蒿中乃至丹丘邊事類賦一九太平御覽九二二旦發鄴城東暮次溟水旁三軍如鄧林武士攻蕭壯北堂書鈔一一七初春含寒氣陽氣匿其暉灰風從天起砂石縱橫飛北堂書鈔一五四和風從東來玄雲起西山夜中發此氣明旦飛甘泉太平御覽一一事類賦三玄雲起高嶽終朝彌八方北堂書鈔一五零藝文類聚一攬衣出巷去素蓋何翩翩北堂書鈔一三四皎月垂素光玄雲為髣佛文選二九傅玄雜詩注又左思雜詩注海録碎事一散禮風雨起北堂書鈔一零零供膳勑中廚九家集注杜詩一三鄭典設自施州歸注朝發白馬暮宿韓陵太平寰宇記五五大廈雲構文選二二陸機招隱詩注又四六王融三月三日曲水詩序注失題文七則失題文七則居山隅而鳳凰集北堂書鈔一六河靈驚而承旗馮夷儼其操北堂書鈔一六雲師灑路雷公警蹕北堂書鈔一六潤八青北堂書鈔六飾玉輅北堂書鈔一六孔氏卓卓信含異氣筆墨之性殆不可勝文心雕龍風骨篇文之體指實強弱使其辭已盡而勢有餘天下一人耳不可得也文心雕龍定勢篇毛詩義問蝃蝀在東鄘夫妻失禮則虹氣盛有赤色在上者陰乘陽氣也虞世南北堂書鈔卷一百五十一抑釋掤忌鄭掤所以覆矢也謂箭筒蓋也北堂書鈔卷一百二十六太平御覽卷三百五十引蓋下有也字有縣貊兮魏貉子曰貆貆形狀與貉類異世人皆名貆徐堅初學記卷二十九蟋蟀在堂唐蟋蟀食蠅而化成太平御覽卷九百四十九鴥彼晨風秦晨風今之鷂歐陽詢藝文類聚卷九十一衡門之下陳橫一本作門而上無屋謂之衡門藝文類聚卷六十三檜鄶在豫州外方之北北鄰於虢都滎之南左濟右洛居兩水之間食溱洧焉酈道元水經注卷二十二引劉楨一之日于貉豳狐之類貉貒狸也貉子似貍初學記卷二十九羅願爾雅翼卷二十二六月食鬱及薁鬱其樹高五六尺其實大如李正赤食之甜詩七月孔穎達正義蠨蛸在戶蠨蛸長腳蜘蛛也太平御覽卷九百四十八辨彼鷽斯小雅有鵯烏雅烏楚烏也初學記卷三十亦有和羹商頌鉶羹有菜鹽豉其中菜為其形象可食因以鉶為名初學記卷二十六太平御覽卷八百六十一
