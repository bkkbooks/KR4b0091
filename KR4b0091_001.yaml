body:
  text: 卷一公讌詩永日行遊戲歡樂猶未央遺思在玄夜相與復翱翔輦車飛素蓋從者盈路傍月出照園中珍木鬱蒼蒼清川過石渠流波為魚防芙蓉散其華菡萏溢金塘靈鳥宿水裔仁獸遊飛梁華館寄流波豁達來風涼生平未始聞歌之安能詳投翰長歎息綺麗不可忘文選二十詩紀十六又書鈔百三十四引旁一韻類聚三十九引央翔傍蒼防塘梁忘八韻御覽七百七十四引傍一韻贈五官中郎將四首贈五官中郎將四首昔我從元后整駕至南鄉過彼豐沛都與君共翱翔四節相推斥季冬風且涼眾賓會廣坐明鐙熺炎光清歌製妙聲萬舞在中堂金罍含甘醴羽觴行無方長夜忘歸來聊且為大康四牡向路馳歡悅誠未央文選二十三又初學記十四引鄉翔光堂方五韻余嬰沈痼疾竄身清漳濱自夏涉玄冬彌曠十餘旬常恐遊岱宗不復見故人所親一何篤步趾慰我身清談同日夕情盻敘憂勤便復為別辭遊車歸西鄰素葉隨風起廣路揚埃塵逝者如流水哀此遂離分追問何時會要我以陽春望慕結不解貽爾新詩文勉哉脩令德北面自寵珍文選二十三詩紀十六又黃氏集千家注杜工部詩史補遺九哭李詩注引分一韻草堂詩箋二十一送韋詩注引濱一韻秋日多悲懷感慨以長歎終夜不遑寐敘意於濡翰明燈曜閨中清風淒已寒白露塗前庭應門重其關四節相推斥歲月忽欲殫壯士遠出征戎事將獨難涕泣灑衣裳能不懷所歡文選二十三詩紀十六涼風吹沙礫霜氣何皚皚明月照緹幕華燈散炎輝賦詩連篇章極夜不知歸君侯多壯思文雅縱橫飛小臣信頑鹵僶俛安能追文選二十三詩紀十六又書鈔百三十二御覽七百各引暉一韻韻補一引皚暉二韻贈徐幹誰謂相去遠隔此西掖垣拘限清切禁中情無由宣思子沈心曲長歎不能言起坐失次第一日三四遷步出北寺門遙望西苑園細柳夾道生方塘含清源輕葉隨風轉飛鳥何翻翻乖人易感動涕下與衿連仰視白日光皦皦高且懸兼燭八紘內物類無頗偏我獨抱深感不得與比焉文選二十三詩紀十六又文選三十一雜體詩注引一句類聚一引懸偏二韻初學記十一引垣宣言遷園源翩七韻又垣宣二韻又垣一韻黃氏集千家注杜工部詩六崔評事詩注引遷一韻事文類聚新集五引垣宣二韻贈從弟三首汎汎東流水磷磷水中石蘋藻生其涯華葉紛擾弱采之薦宗廟可以羞嘉客豈無園中葵懿此出深澤文選二十三詩紀十六亭亭山上松瑟瑟谷中風風聲一何盛松枝一何勁冰霜正慘悽終歲常端正豈不罹凝寒松柏有本性文選二十三類聚八十八文章正宗二十九詩紀十六又文選秘府論南卷引風勁二韻鳳凰集南嶽徘徊孤竹根於心有不厭奮翅凌紫氛豈不常勤苦羞與黃雀群何時當來儀將須聖明君文選二十三初學記三十文章正宗二十九錦繡萬花谷後集四十詩紀十六又類聚九十引根氛群三韻雜詩雜詩職事相填委文墨紛消散馳翰未暇食日昃不知晏沈迷簿領書回回自昏亂釋此出西城登高且遊觀方塘含白水中有鳧與鴈安得肅肅羽從爾浮波瀾文選二十九文章正宗二十九詩紀十六又文選四十三丘希範與陳伯之書注引亂一韻書鈔三十六引散亂二韻又晏一韻草堂詩箋八白水詩注引起首一句鬭雞丹雞被華采雙距如鋒芒願一揚炎威會戰此中唐利爪探玉除瞋目含火光長翹驚風起勁翮正敷張輕舉奮勾喙電擊復還翔類聚九十一詩紀十六射鳶鳴鳶弄雙翼飄飄薄青雲我后橫怒起意氣凌神仙發機如驚猋三發兩鳶連流血灑牆屋飛毛從風旋庶士同聲贊君射一何妍類聚九十二詩紀十六失題二首昔君錯畦畤東土有素木條柯不盈尋一尺再三曲隱生寘翳林倥惚自迫束得託芳蘭苑列植高山足闕類聚八十八詩紀十六二青青女蘿草上依高松枝幸蒙庇養恩分惠不可貲風雨雖急疾根株不傾移闕類聚八十一詩紀十六又御覽九百九十三引枝訾二韻詩天地無期竟民生甚局促為稱百年壽誰能應此錄低昂倏忽去炯若風中燭御覽八百七十
